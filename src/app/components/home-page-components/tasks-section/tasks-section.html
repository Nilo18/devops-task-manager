<h1>Tasks</h1>
<p class="intro">Review your tasks and track their progress</p>

<section class="card" aria-labelledby="task-list-title">
  <div class="card-header">
    <div>
      <h2 id="task-list-title">All Tasks</h2>
      <p>A list of tasks and their current status</p>
    </div>
    <span class="count">0 tasks</span>
  </div>

  <div class="table-scroll">
    <table aria-labelledby="task-list-title">
      <thead>
        <tr>
          <th scope="col">Task</th>
          <th scope="col">Status</th>
          <th scope="col">Priority</th>
          <th scope="col">Due date</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="4">
            <div class="empty">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m3 6 2 2 3-4m-5 9 2 2 3-4m-4 9h2M11 6h10m-10 7h10m-10 7h10" />
              </svg>
              <h3>No tasks yet</h3>
              <p>Your tasks will appear here when they’re available.</p>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
