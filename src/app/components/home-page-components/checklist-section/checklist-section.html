<h1>Daily Checklist</h1>
<p class="intro">Keep track of what needs to get done today</p>

<section class="card" aria-labelledby="checklist-title">
  <div class="card-header">
    <div>
      <h2 id="checklist-title">Today’s Checklist</h2>
      <p>Track your progress through the day</p>
    </div>
    <span class="count">0 of 0 complete</span>
  </div>

  <div class="empty">
    <mat-icon>checklist</mat-icon>
    <h3>No checklist items yet</h3>
    <p>Items on today’s checklist will appear here.</p>
  </div>
</section>
