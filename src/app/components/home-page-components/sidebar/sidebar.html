<div class="brand"><mat-icon>check_box</mat-icon>{{ workspace.name() }}</div>
<nav aria-label="Main navigation">
  @for (link of links; track link; let index = $index) {
    <button type="button" [attr.aria-current]="active() === index ? 'page' : null" (click)="navigate.emit(index)"><mat-icon>{{ icons[index] }}</mat-icon>{{ link }}</button>
  }
</nav>
